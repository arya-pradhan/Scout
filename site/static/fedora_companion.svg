<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Green Companion Head -->
  <circle cx="256" cy="290" r="150" fill="#145643" />

  <!-- Eyes -->
  <g fill="#111111">
    <rect x="177" y="235" width="38" height="84" rx="19" />
    <rect x="297" y="235" width="38" height="84" rx="19" />
  </g>

  <!-- Classic Brown Fedora (flat 2D) -->
  <g>
    <!-- Back brim (sits behind the crown, peeks out at the sides) -->
    <path d="M 60 184 C 110 158, 402 158, 452 184 L 256 200 Z" fill="#6e4520" />

    <!-- Crown: tapered sides, pinched front, dented top -->
    <path d="M 168 176
             C 164 134, 172 98, 190 80
             C 212 66, 236 84, 256 90
             C 276 84, 300 66, 322 80
             C 340 98, 348 134, 344 176 Z"
          fill="#8b5a2b" />

    <!-- Center teardrop crease -->
    <path d="M 256 92 C 247 108, 245 128, 249 146 L 263 146 C 267 128, 265 108, 256 92 Z"
          fill="#6e4520" />

    <!-- Hat band (bottom edge meets the front brim) -->
    <path d="M 168 146 C 210 154, 302 154, 344 146
             L 344 172 C 302 180, 210 180, 168 172 Z"
          fill="#3a2314" />

    <!-- Front brim: top edge hugs the band, dips down in front -->
    <path d="M 60 184
             C 120 170, 190 176, 256 178
             C 322 176, 392 170, 452 184
             C 420 208, 330 222, 256 222
             C 182 222, 92 208, 60 184 Z"
          fill="#8b5a2b" />

    <!-- Brim edge -->
    <path d="M 60 184 C 92 208, 182 222, 256 222 C 330 222, 420 208, 452 184
             C 418 202, 330 214, 256 214 C 182 214, 94 202, 60 184 Z"
          fill="#6e4520" />
  </g>
</svg>
